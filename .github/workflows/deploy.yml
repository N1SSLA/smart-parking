name: Deploy to server

on:
  pull_request:
  push:
    branches: [main]
#    branches: [ main ] 

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]
    
    # защита от параллельных запусков
    concurrency:
      group: deploy-to-pc
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync files to deploy directory
        shell: powershell
        run: |
          $targetDir = "C:\github-deploy\smart-parking"
          if (!(Test-Path $targetDir)) { New-Item -ItemType Directory -Path $targetDir -Force }
          
          robocopy ${{ github.workspace }} $targetDir /E /XD .git /NFL /NDL /NJH /NJS
          
          if ($LASTEXITCODE -ge 8) { 
              Write-Error "Robocopy failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE 
          } else { 
              Write-Host "Robocopy completed with exit code $LASTEXITCODE (success)"
              exit 0 
          }

      # Проверка кода (для Python)
      - name: Tests
        shell: powershell
        working-directory: C:\github-deploy\smart-parking\server
        run: |

      # Поднять контейнеры
      - name: Start Docker Compose
        shell: powershell
        working-directory: C:\github-deploy\smart-parking
        run: |
          docker compose down

          docker compose up -d --build

      # Проверка, что сервер запустился
      - name: Health Check
        shell: powershell
        run: |
          Start-Sleep -Seconds 10
          $response = Invoke-WebRequest -Uri http://localhost:8000/health -UseBasicParsing
          if ($response.StatusCode -eq 200) {
            Write-Host "Server started!"
          } else {
            throw "Server not started"
          }
      
      
      
      - name: Start Tunnel and Extract URL
        id: tunnel
        shell: powershell
        run: |
          Get-Process -Name "xtunnel" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 1

          $logPath = "C:\github-deploy\tunnel.log"

          if (Test-Path $logPath) { Remove-Item $logPath -Force }

          cmd.exe /c start "" /B "C:\Users\PC\Desktop\xtunnel.exe" http 8000 > $logPath 2>&1

          Start-Sleep -Seconds 5

          $logContent = Get-Content $logPath -Raw -ErrorAction SilentlyContinue
          
          if ($logContent -match 'https://[a-zA-Z0-9-]+\.tunnel4\.com') {
              $publicUrl = $matches[0]
              Write-Host "New URL of server: $publicUrl"
              "PUBLIC_URL=$publicUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              Write-Warning "URL not found. Logs:"
              Write-Host $logContent
              "PUBLIC_URL=URL_NOT_FOUND" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
